# Configuração do Dependabot para este repositório.
# A única dependência aqui são as GitHub Actions usadas em .github/workflows.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '10:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci'
    labels:
      - 'github-actions'
      - 'automated'
